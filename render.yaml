# Reviewed in the Render dashboard before deployment. Persistent disks require a paid plan.
services:
  - type: web
    name: nutri-portal
    runtime: node
    plan: starter
    numInstances: 1
    buildCommand: node --check server.js
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: "true"
      - key: DATA_DIR
        value: /var/data/portal
    disk:
      name: nutri-data
      mountPath: /var/data
      sizeGB: 1
