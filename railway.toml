[deploy]
startCommand = "npm start"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
# In Railway, attach a persistent volume at /data and set DATA_DIR=/data/portal,
# NODE_ENV=production, COOKIE_SECURE=true and HOST=0.0.0.0 in service variables.
# The platform provides PORT. Keep a single replica for the JSON data store.
